services:
  # Next.js（フロントエンド + API + tRPC を集約）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  # ローカル開発時に Neon を使わず Postgres を起動したいときに使う（任意）
  # 通常は .env.local の DATABASE_URL に Neon を指す
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: uno_score_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "9876:5432"

volumes:
  postgres_data:
